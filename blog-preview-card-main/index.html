<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/styles.css">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="post-banner">
      <img class="banner" src="./assets/images/illustration-article.svg" alt="banner" srcset="">
    </div>
    <p class="post-category">Learning</p>
    <p class="post-date">Published 21 Dec 2023</p>
    <h2 class="post-title">HTML & CSS foundations</h2>
    <p class="post-description">
      These languages are the backbone of every website, defining structure, content, and presentation.
    </p>
    <div class="post-author">
      <img class="user-photo" src="./assets/images/image-avatar.webp" alt="profile-pic">
      <h3 class="user-name">Greg Hooper</h3>
    </div>
  </div>
</body>
</html>
