<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="css/styles.css">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">
      <img class="profile__image" src="./assets/images/avatar-jessica.jpeg" alt="profile image">
      <h2 class="profile__name">Jessica Randall</h2>
      <p class="profile__city">London, United Kingdom</p>
      <p class="profile__resume">"Front-end developer and avid reader."</p>
    </div>
    <div class="social-links">
      <button class="social-links__button">Github</button>
      <button class="social-links__button">Frontend Mentor</button>
      <button class="social-links__button">LinkedIn</button>
      <button class="social-links__button">Twitter</button>
      <button class="social-links__button">Instagram</button>
    </div>
  </div>
</body>
</html>
